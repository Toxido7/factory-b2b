services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: factory-mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP: where our app sends emails
      - "127.0.0.1:8025:8025" # Web page: where you read them
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    container_name: factory-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
